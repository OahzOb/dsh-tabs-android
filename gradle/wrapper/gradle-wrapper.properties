distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Where the wrapper gets Gradle 8.9.
#
# **This points at this checkout's own copy, and that is not portable.** It was
# written because the official host is unreachable from the machine this was
# developed on — TLS to services.gradle.org fails through a local proxy, while
# dl.google.com, repo1.maven.org and github.com all succeed through it. Measured
# twice: `gradle wrapper` refuses to write the official URL there at all
# (`Test of distribution url … failed`), and the wrapper itself times out on it after
# 10 s. Gradle's wrapper reads `distributionUrl` from this file and honours no
# environment override for it, so there is no way to keep both a portable default
# here and a working build there.
#
# Someone cloning this needs their own distribution. Either:
#
#   * unpack a Gradle 8.9 next to your checkout and point the path below at its zip,
#     built with `bsdtar` rather than `Compress-Archive` — the latter omits directory
#     entries and the wrapper's unzip then fails with `Could not unzip … (The system
#     cannot find the path specified)` on the first file; or
#   * drop this line and use the official URL, if your network reaches it:
#       distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
#
# Either way `.\gradlew.bat` is the entry point and the distribution is extracted into
# ~\.gradle\wrapper\dists on first use, so only the first build needs the zip.
distributionUrl=file\:/C:/android-toolchain/gradle-8.9-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
