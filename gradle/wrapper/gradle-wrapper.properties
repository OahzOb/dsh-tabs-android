distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Where the wrapper gets Gradle 8.9.
#
# **The official URL, so that a fresh clone builds anywhere.** It is deliberately not
# pointed at any one machine's copy of the distribution: a path that only exists on
# the machine it was written on is not a default, it is a break waiting for the first
# person who clones this.
#
# It was briefly pinned to a local zip, because the official host was unreachable from
# the machine this was developed on — TLS to services.gradle.org failed through a local
# proxy, while dl.google.com, repo1.maven.org and github.com all succeeded through it.
# Measured twice: `gradle wrapper` refused to write the official URL there at all
# (`Test of distribution url … failed`), and the wrapper itself timed out on it after
# 10 s.
#
# If your network cannot reach the official host either, do **not** commit your fix —
# Gradle's wrapper reads `distributionUrl` from this file and honours no environment
# override, so the workaround is local by nature. Either point the line below at a zip
# you unpacked yourself and leave that edit uncommitted, or pre-seed the extraction
# directory (~\.gradle\wrapper\dists\gradle-8.9-bin\<hash>\) so the wrapper finds the
# distribution already in place and never downloads.
#
# If you do build a local zip, use `bsdtar` rather than `Compress-Archive`: the latter
# omits directory entries and the wrapper's unzip then fails with
# `Could not unzip … (The system cannot find the path specified)` on the first file.
#
# Either way `.\gradlew.bat` is the entry point and the distribution is extracted into
# ~\.gradle\wrapper\dists on first use, so only the first build needs the zip.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
