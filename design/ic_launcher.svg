<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 132" width="340" height="132">
  <!--
    The launcher icon as one picture, at the size it is drawn: the two layers that
    `drawable/ic_launcher_background.xml` and `drawable/ic_launcher_foreground.xml`
    hold, composited, and then shown under three of the masks a launcher may apply.
    This file is the design, not a resource — nothing in the application reads it —
    and it is here so the next person to touch the icon can see what the two XML
    files add up to without building the app and installing it.

    The mark is smaller than the canvas on purpose, and smaller than the desktop
    client's. A launcher is only obliged to keep the central 66dp circle of the 108dp
    canvas, so the drawing lives inside a 50x48dp box whose furthest corner is 32.6dp
    from the centre; the rest of the canvas exists to be cropped. The desktop icon is
    the same drawing laid out for a square canvas, where it can use the corners.
  -->
  <defs>
    <clipPath id="circle"><circle cx="54" cy="54" r="36"/></clipPath>
    <clipPath id="squircle"><rect x="14" y="14" width="80" height="80" rx="24"/></clipPath>
    <clipPath id="rounded"><rect x="10" y="10" width="88" height="88" rx="14"/></clipPath>
    <g id="layers">
      <rect width="108" height="108" fill="#fbfbfb"/>
      <g stroke="#31343c" stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M53 47 L56.5 44.5"/>
        <path d="M58 43.5 L61.5 41"/>
        <path d="M53 61 L56.5 63.5"/>
        <path d="M58 65.5 L61.5 68"/>
      </g>
      <path d="M34 41 h10 a8 8 0 0 1 8 8 v10 a8 8 0 0 1 -8 8 h-10 a8 8 0 0 1 -8 -8 v-10 a8 8 0 0 1 8 -8 z" fill="#31343c"/>
      <path d="M35 47 h8 a3 3 0 0 1 0 6 h-8 a3 3 0 0 1 0 -6 z" fill="#fbfbfb"/>
      <path d="M68 30 h2 a6 6 0 0 1 6 6 v2 a6 6 0 0 1 -6 6 h-2 a6 6 0 0 1 -6 -6 v-2 a6 6 0 0 1 6 -6 z" fill="#b6bbc4"/>
      <path d="M68 64 h2 a6 6 0 0 1 6 6 v2 a6 6 0 0 1 -6 6 h-2 a6 6 0 0 1 -6 -6 v-2 a6 6 0 0 1 6 -6 z" fill="#dcdfe4"/>
    </g>
  </defs>

  <g transform="translate(8,12)"><g clip-path="url(#circle)"><use href="#layers"/></g></g>
  <g transform="translate(124,12)"><g clip-path="url(#squircle)"><use href="#layers"/></g></g>
  <g transform="translate(240,12)"><g clip-path="url(#rounded)"><use href="#layers"/></g></g>
</svg>
