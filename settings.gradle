pluginManagement {
	repositories {
		google()
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		// The Android Gradle Plugin. Paired with Gradle 8.9 in
		// gradle/wrapper/gradle-wrapper.properties — AGP 8.7 requires Gradle 8.9+.
		id 'com.android.application' version '8.7.3'
		id 'org.jetbrains.kotlin.android' version '2.0.21'
	}
}

dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
	repositories {
		google()
		mavenCentral()
	}
}

rootProject.name = 'dsh-tabs-android'
include ':app'
